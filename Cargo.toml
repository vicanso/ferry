[workspace]
resolver = "2"
members = [
    "crates/protocol",
    "crates/redis",
    "crates/client",
    "crates/agent",
    "crates/git",
    "crates/git-api",
    "crates/ferry",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
bridge-protocol = { path = "crates/protocol" }
bridge-redis = { path = "crates/redis" }
ferry-git = { path = "crates/git" }
# 供 ferry 合并二进制复用;两者也各自保留独立 bin,便于单跑与调试
bridge-agent = { path = "crates/agent" }
ferry-git-api = { path = "crates/git-api" }

# tibba 已发布,直接用版本依赖。0.2.7 起 core 组件按依赖 DAG 重新分批
# (error → util/config/crypto/runtime → cache/request),ferry 只用到其中三个:
# error(C1)、config(C2)、cache(C3);不再依赖本地目录,`docker build .` 也不受
# 构建上下文限制。
tibba-cache = "0.2.7"
tibba-config = "0.2.7"
tibba-error = "0.2.7"

# ferry 不声明任何 Redis 生态依赖:连接池归 tibba-cache,构造命令用的 `redis` crate
# 也由它转出(bridge-redis 再转一手给 client/agent)。版本对齐完全由 tibba 保证,
# 连理论上分叉的可能都没有 —— 分叉会导致 ConnectionLike 不是同一个 trait。
# TLS 同理:要走 rediss:// 就在 tibba 侧开 rustls feature。
# tokio 本身无 default feature,各 crate 按实际用到的 API 自行开启
tokio = "1.52.3"
tokio-util = "0.7.18"
# rustls-no-provider:开 TLS,但不让 reqwest 替我们挑 crypto provider。
# reqwest 0.13 起 feature 改了名,"rustls" 等价于 aws-lc-rs,会拖进 aws-lc-sys(C,
# builder 得额外装 cmake + clang);"rustls-no-provider" 把选择权交出来,由 agent 在建
# Client 之前装上 ring —— 纯 Rust(含少量汇编),Debian 镜像不必再加编译工具链。
# 代价是**必须**装:没装时 reqwest 在 Client::builder().build() 里直接 panic 而不是
# 返回 Err,map_err 兜不住 —— 见 crates/agent 的 ensure_crypto_provider。
# 根证书走 rustls-platform-verifier(读系统信任库),runtime 镜像需要 ca-certificates,
# 已因 libgit2 装了;内网自签 CA 得自行灌进系统信任库,光开 TLS 不够。
# native-tls / openssl 仍然连 Cargo.lock 里都没有。
#
# gzip / brotli:让 reqwest 透明解压上游响应(agent 会剥掉调用方的 accept-encoding、
# 由 reqwest 自行协商)。两者均为纯 Rust(flate2+miniz_oxide / brotli),不引 C 依赖,
# runtime 镜像无需额外系统库。要 deflate / zstd 再加同名特性即可(zstd 会带 C 绑定)。
reqwest = { version = "0.13.4", default-features = false, features = [
    "http2",
    "gzip",
    "brotli",
    "rustls-no-provider",
] }

# 直接依赖 rustls 只为一件事:给上面的 reqwest 装 ring provider。
# default-features = false 是关键 —— rustls 的默认 feature 里有 aws_lc_rs,
# 且 prefer-post-quantum 也强制要它,不关就白绕了。tls12 保留:内网服务常常只到 1.2。
rustls = { version = "0.23.42", default-features = false, features = [
    "ring",
    "std",
    "tls12",
    "logging",
] }
serde_json = "1.0.150"
# 与 Go encoding/json 对 []byte 的处理对齐:标准字母表 + 填充
base64 = "0.22.1"
bytes = "1.12.0"
uuid = { version = "1.23.4", features = ["v4", "serde"] }
dashmap = "6.2.1"
serde = { version = "1.0.228", features = ["derive"] }
snafu = "0.9.1"
url = "2.5.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

# libgit2 的 Rust 绑定,只给 ferry-git 用。
#
# https / ssh 这两个 feature 是「pull 能走网络」的前提,代价是拖进 openssl-sys 与
# libssh2-sys —— libgit2 是 C 库,不认 rustls,这条绕不开(全项目唯一的例外,其余
# 地方仍坚持 rustls)。关掉这两个 feature 依赖树会很干净,但 fetch 只剩本地路径,
# 等于废掉 pull。
#
# 影响范围仅限本 crate:Dockerfile 只 `cargo build -p bridge-agent`,openssl 不会
# 被编进 agent 镜像,也不需要在 runtime 层装 libssl —— 只是 Cargo.lock 里多几条记录。
# 将来若要把 ferry-git 也打进镜像,builder 阶段需要 pkg-config + libssl-dev,
# runtime 阶段需要 libssl3 与 ca-certificates。
git2 = { version = "0.21.0", default-features = false, features = [
    "https",
    "ssh",
] }
tempfile = "3.24.0"

# HTTP 服务端,只给 ferry-git-api 用。版本跟着 tibba-error 走 —— 它本来就依赖
# axum 并为自己的 Error 实现了 IntoResponse,两边版本必须一致,否则 trait 不是
# 同一个,错误类型根本返回不出去。
axum = "0.8.9"
