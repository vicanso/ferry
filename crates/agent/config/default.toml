# agent 的默认配置,通过 include_str! 烘焙进二进制。
#
# 三层叠加,后者覆盖前者:
#   1. 本文件
#   2. FERRY_CONFIG 指向的外部 TOML(可选)
#   3. 环境变量,前缀 FERRY,层级分隔符是双下划线
#      例如 FERRY__REDIS__URI、FERRY__AGENT__MAX_CONCURRENCY
#
# 容器里通常什么都不挂,直接用环境变量覆盖即可。

[redis]
# 支持 tibba 的聚合写法:一个 scheme + 逗号分隔的多个 host + 查询参数。
# 密码只写一次,不必在每个节点上重复;rediss:// 会被保留为 TLS。
# 连接池参数(pool_size、connection_timeout 等)写在查询串里,例如
#   redis://:pw@h1:6379,h2:6379/?pool_size=20&connection_timeout=3s
uri = "redis://127.0.0.1:6379"

[agent]
# 消费哪个服务的请求队列,对应 {key_prefix}:req:{service}
service = "demo"

# Redis key 前缀,请求 / 响应队列都用它:{key_prefix}:req:{service}、
# {key_prefix}:resp:{...}。**调用方(A 侧)必须用同一个前缀**,否则两端看不到对方。
# 留空 / 删除本行则回退默认 bridge。
key_prefix = "bridge"

# 同时在途的请求数上限,也是 semaphore 的许可总数
max_concurrency = 64

# 服务名 → 真实上游。调用方只写 https://{服务名}/path,真实 host(以及可选的注入
# header)只在这里、不进 Redis;服务名不在表里就拒绝,**留空则拒绝启动**。
#
# 两种写法:
#   1) 裸字符串 —— 只有 base、不注入 header:
#        grok = "http://10.51.0.5:7257"
#   2) base + headers 的表 —— 转发时注入这些 header,**覆盖调用方同名**(config wins),
#      适合放调用方不该经手的凭证(值在启动时校验,且不会进日志):
#        [agent.upstreams.grok]
#        base = "http://10.51.0.5:7257"
#        [agent.upstreams.grok.headers]
#        authorization = "Bearer sk-..."
#
# 环境变量:无 header 用逗号分隔的整表简写
#   FERRY__AGENT__UPSTREAMS=grok=http://10.51.0.5:7257,api=http://127.0.0.1:8080/api
# 带 header 用嵌套写法(密钥留在 env、不进 Redis;此时不能再用上面的逗号简写)
#   FERRY__AGENT__UPSTREAMS__GROK__BASE=http://10.51.0.5:7257
#   FERRY__AGENT__UPSTREAMS__GROK__HEADERS__AUTHORIZATION=Bearer sk-...
[agent.upstreams]
# grok = "http://10.51.0.5:7257"
# api  = "http://127.0.0.1:8080/api"
